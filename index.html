<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Call of Labs</title>
<meta name="description" content="연구실에서 살아남기부터 HBM 수박게임까지. 대학원생을 위한 미니게임 아케이드.">
<meta property="og:title" content="Call of Labs">
<meta property="og:description" content="대학원생을 위한 미니게임 아케이드">
<meta property="og:image" content="https://calloflabs.github.io/img/no-other-choice.webp">
<meta name="theme-color" content="#1b2436">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%231b2436'/%3E%3Crect x='6' y='6' width='20' height='20' fill='%23ffd23f'/%3E%3Crect x='10' y='10' width='4' height='4' fill='%231b2436'/%3E%3Crect x='18' y='10' width='4' height='4' fill='%231b2436'/%3E%3Crect x='10' y='19' width='12' height='3' fill='%231b2436'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/galmuri/dist/galmuri.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
:root{
  --ink:#1b2436;        /* lab-coat navy */
  --ink-2:#4b566b;
  --paper:#eef1f4;      /* lab tile white */
  --grid:#d6dde6;
  --tape:#ffd23f;       /* caution tape */
  --tape-ink:#1b2436;
  --card:#ffffff;
  --accent:#e2443b;     /* REJECTED stamp red */
  --ok:#2fb36a;
  --radius:6px;
  --pix:'Galmuri11','Galmuri9','DungGeunMo',monospace;
  --sans:'Pretendard',-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Segoe UI',Roboto,sans-serif;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0;color:var(--ink);font-family:var(--sans);line-height:1.5;
  background:var(--paper);
  background-image:
    linear-gradient(var(--grid) 1px,transparent 1px),
    linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:24px 24px;
  min-height:100svh;
}
a{color:inherit}
:focus-visible{outline:3px solid var(--tape);outline-offset:3px}

/* ---------- header: lab door sign ---------- */
.door{
  background:var(--ink);color:#fff;
  padding:max(18px,env(safe-area-inset-top)) 16px 0;
}
.door-in{max-width:1080px;margin:0 auto;display:flex;align-items:flex-end;justify-content:space-between;gap:16px;padding-bottom:16px}
.brand{display:flex;flex-direction:column;gap:4px;min-width:0}
.brand h1{
  font-family:var(--pix);font-weight:400;font-size:clamp(26px,6.5vw,44px);line-height:1;margin:0;
  letter-spacing:.5px;text-shadow:3px 3px 0 #0c1220;
}
.brand p{margin:0;font-size:clamp(13px,3.4vw,16px);color:#c5cddc}
.lang{
  display:inline-flex;border:2px solid #fff;border-radius:999px;overflow:hidden;flex:none;
  font-family:var(--pix);font-size:13px;
}
.lang button{
  appearance:none;border:0;background:transparent;color:#fff;padding:7px 12px;cursor:pointer;font:inherit;line-height:1;
}
.lang button[aria-pressed="true"]{background:#fff;color:var(--ink)}
.tape{
  height:14px;
  background:repeating-linear-gradient(135deg,var(--tape) 0 18px,var(--tape-ink) 18px 36px);
}

/* ---------- grid ---------- */
main{max-width:1080px;margin:0 auto;padding:22px 16px calc(28px + env(safe-area-inset-bottom))}
.lede{margin:0 0 18px;font-size:15px;color:var(--ink-2);max-width:60ch}
.grid{
  display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;
  list-style:none;margin:0;padding:0;
}
@media (min-width:720px){.grid{grid-template-columns:repeat(3,minmax(0,1fr));gap:18px}}
@media (min-width:1000px){.grid{grid-template-columns:repeat(4,minmax(0,1fr))}}

.card{
  background:var(--card);border:2px solid var(--ink);border-radius:var(--radius);
  box-shadow:4px 4px 0 var(--ink);
  display:flex;flex-direction:column;overflow:hidden;position:relative;
}
.card:active{transform:translate(2px,2px);box-shadow:2px 2px 0 var(--ink)}
.card a.hit{position:absolute;inset:0;z-index:2;border-radius:inherit}
.thumb{aspect-ratio:4/5;display:block;width:100%;height:auto;object-fit:cover;background:#dfe5ec;border-bottom:2px solid var(--ink)}
.plate{
  position:absolute;left:0;right:0;top:0;aspect-ratio:4/5;pointer-events:none;
  display:flex;align-items:flex-end;
}
.plate h2{
  margin:0;width:100%;padding:28px 10px 10px;
  font-family:var(--pix);font-weight:400;font-size:clamp(15px,3.9vw,19px);line-height:1.2;color:#fff;
  text-shadow:2px 2px 0 #000,0 0 14px rgba(0,0,0,.6);
  background:linear-gradient(to top,rgba(10,16,30,.85),rgba(10,16,30,0));
  word-break:keep-all;
}
.body{padding:10px 10px 12px;display:flex;flex-direction:column;gap:8px;flex:1}
.body p{margin:0;font-size:13.5px;color:var(--ink-2);word-break:keep-all;flex:1}
.meta{display:flex;flex-wrap:wrap;gap:6px}
.chip{
  font-family:var(--pix);font-size:11px;line-height:1;padding:5px 7px 4px;
  border:1.5px solid var(--ink);border-radius:4px;background:var(--paper);
}
.chip.rank{background:var(--tape)}
.play{
  margin-top:2px;display:inline-flex;justify-content:center;align-items:center;gap:6px;
  font-family:var(--pix);font-size:14px;padding:10px 12px 9px;border-radius:4px;
  background:var(--accent);color:#fff;border:2px solid var(--ink);text-decoration:none;
}
.card:hover .play{filter:brightness(1.06)}
.src{position:absolute;right:8px;top:8px;z-index:3;font-size:11px;background:rgba(255,255,255,.92);border:1.5px solid var(--ink);border-radius:4px;padding:3px 6px;text-decoration:none;font-family:var(--pix)}

/* ---------- footer ---------- */
footer{max-width:1080px;margin:0 auto;padding:10px 16px 36px;color:var(--ink-2);font-size:13px;display:flex;flex-wrap:wrap;gap:6px 18px;align-items:center}
footer a{text-decoration:underline;text-underline-offset:3px}
.note{width:100%;margin-top:6px;font-size:12.5px}

@media (prefers-reduced-motion:no-preference){
  .card{transition:transform .08s ease,box-shadow .08s ease}
}
</style>
</head>
<body>

<header class="door">
  <div class="door-in">
    <div class="brand">
      <h1>Call of Labs</h1>
      <p data-i18n="tagline">대학원생을 위한 미니게임 아케이드</p>
    </div>
    <div class="lang" role="group" aria-label="Language">
      <button type="button" data-lang="ko" aria-pressed="true">한국어</button>
      <button type="button" data-lang="en" aria-pressed="false">EN</button>
    </div>
  </div>
  <div class="tape" aria-hidden="true"></div>
</header>

<main>
  <p class="lede" data-i18n="lede">장비를 두들기고 리뷰어를 쓰러뜨리고 교수님을 학회장까지 모시는 게임들. 폰에서 바로 됩니다. 설치 없음.</p>
  <ul class="grid" id="grid"></ul>
</main>

<footer>
  <a href="https://www.instagram.com/calloflabs" target="_blank" rel="noopener">Instagram @calloflabs</a>
  <a href="https://github.com/calloflabs" target="_blank" rel="noopener">GitHub</a>
  <span class="note" data-i18n="note">모든 게임은 브라우저에서 돌아가는 단일 HTML 파일입니다. 랭킹은 게임 안에서 등록합니다.</span>
</footer>

<script>
const GAMES = [
  {
    id:'lab-survival',
    url:'https://lab-survival.vercel.app/',
    repo:'https://github.com/calloflabs/lab-survival',
    img:'img/lab-survival.webp',
    ko:{ title:'연구실에서 살아남기', desc:'장비를 두들겨 데이터를 뽑고 논문을 써서 연구비를 따고 랩을 키우는 3D 게임. 월급날은 꼬박꼬박 옵니다.' },
    en:{ title:'Lab Survival', desc:'Smash equipment for data. Write papers. Win grants. Grow the lab before payroll comes due.' },
    tags:['3D','rank']
  },
  {
    id:'no-other-choice',
    url:'https://no-other-choice.vercel.app/',
    repo:'https://github.com/calloflabs/no-other-choice',
    img:'img/no-other-choice.webp',
    ko:{ title:'어쩔수가없다', desc:'10분 동안 리뷰어 1~5를 버티고 Chief Editor를 쓰러뜨리면 ACCEPTED. 바닥의 무기를 주워 강화하는 생존 슈팅.' },
    en:{ title:'No Other Choice', desc:'Survive Reviewers 1–5 for ten minutes and take down the Chief Editor. Pick up weapons off the floor.' },
    tags:['3D','rank']
  },
  {
    id:'road-to-the-conference',
    url:'https://road-to-the-conference.vercel.app/',
    repo:'https://github.com/calloflabs/road-to-the-conference',
    img:'img/road-to-the-conference.webp',
    ko:{ title:'학회 가는 길', desc:'세션 20분 전. 교수님을 조수석에 태우고 거위 떼와 학과장님을 피해 학회장까지. 브레이크는 없습니다.' },
    en:{ title:'Road to the Conference', desc:'Twenty minutes to the session. Your professor is in the passenger seat. There is no brake.' },
    tags:['3D','rank']
  },
  {
    id:'stack-hbm',
    url:'https://stack-hbm.vercel.app/',
    repo:'https://github.com/calloflabs/stack-hbm',
    img:'img/stack-hbm.webp',
    ko:{ title:'HBM 수박게임', desc:'수박 대신 웨이퍼. 중력 대신 스핀코터. 실리콘에서 12단 HBM까지 합치면 하이닉스에 갈 수 있을지도.' },
    en:{ title:'Stack HBM', desc:'Suika with wafers. A spin coater instead of gravity. Merge from silicon to a 12-high HBM stack.' },
    tags:['2D','rank']
  },
  {
    id:'tower-of-graduation',
    url:'tower-of-graduation/',
    repo:'https://github.com/calloflabs/calloflabs.github.io/tree/main/tower-of-graduation',
    img:'img/tower-of-graduation.webp',
    koOnly:true,
    ko:{ title:'졸업의 탑', desc:'탑 꼭대기에 졸업장이 있다. 리뷰어 떼와 교수님보다 빨리 올라가라. 좌우 드래그로 데이터를 줍고 점프·슬라이드로 피하는 러너.' },
    en:{ title:'Tower of Graduation', desc:'The diploma is at the top. Outrun the reviewers and your professor. Drag to collect data. Jump and slide past everything else.' },
    tags:['3D','rank']
  },
  {
    id:'road-to-submission',
    url:'road-to-submission/',
    repo:'https://github.com/calloflabs/calloflabs.github.io/tree/main/road-to-submission',
    img:'img/road-to-submission.webp',
    koOnly:true,
    ko:{ title:'초록 제출하러 가는 길', desc:'마감 90초 전. 차도 50개 너머의 제출 창구까지 초록 한 장 들고 뛰어라. 못 내면 죽는다. 비유가 아니다.' },
    en:{ title:'Road to Submission', desc:'Ninety seconds to the deadline. Fifty lanes of traffic between you and the submission desk. Miss it and you die. Not a metaphor.' },
    tags:['3D','rank']
  }
];

const I18N = {
  ko:{ koOnly:'한국어', tagline:'대학원생을 위한 미니게임 아케이드', lede:'장비를 두들기고 리뷰어를 쓰러뜨리고 교수님을 학회장까지 모시는 게임들. 폰에서 바로 됩니다. 설치 없음.', play:'플레이', rank:'랭킹', src:'소스', note:'모든 게임은 브라우저에서 돌아가는 단일 HTML 파일입니다. 랭킹은 게임 안에서 등록합니다.' },
  en:{ koOnly:'Korean only', tagline:'A mini-game arcade for grad students', lede:'Smash equipment. Fight reviewers. Drive your professor to the conference. Plays in the browser on your phone. Nothing to install.', play:'Play', rank:'Ranked', src:'Source', note:'Every game is a single HTML file that runs in the browser. Rankings are submitted inside each game.' }
};

let lang = (()=>{
  const q = new URLSearchParams(location.search).get('lang');
  if (q==='en'||q==='ko') return q;
  try{ const s = localStorage.getItem('col_lang'); if (s==='en'||s==='ko') return s; }catch(e){}
  return /^en/i.test(navigator.language||'') ? 'en' : 'ko';
})();

function playUrl(g){ return (lang==='en' && !g.koOnly) ? g.url + '?lang=en' : g.url; }

function render(){
  const t = I18N[lang];
  document.documentElement.lang = lang;
  document.querySelectorAll('[data-i18n]').forEach(el=>{ el.textContent = t[el.dataset.i18n]; });
  document.querySelectorAll('.lang button').forEach(b=>b.setAttribute('aria-pressed', String(b.dataset.lang===lang)));
  const grid = document.getElementById('grid');
  grid.innerHTML = GAMES.map(g=>{
    const s = g[lang];
    const chips = g.tags.map(tag => tag==='rank'
      ? `<span class="chip rank">${t.rank}</span>`
      : `<span class="chip">${tag}</span>`).join('') + ((g.koOnly && lang==='en') ? `<span class="chip">${t.koOnly}</span>` : '');
    return `<li class="card">
      <a class="hit" href="${playUrl(g)}" aria-label="${s.title}"></a>
      <a class="src" href="${g.repo}" target="_blank" rel="noopener">${t.src}</a>
      <img class="thumb" src="${g.img}" alt="" width="600" height="750" loading="lazy" decoding="async">
      <div class="plate"><h2>${s.title}</h2></div>
      <div class="body">
        <p>${s.desc}</p>
        <div class="meta">${chips}</div>
        <span class="play">▶ ${t.play}</span>
      </div>
    </li>`;
  }).join('');
}

document.querySelectorAll('.lang button').forEach(b=>b.addEventListener('click',()=>{
  lang = b.dataset.lang;
  try{ localStorage.setItem('col_lang', lang); }catch(e){}
  const u = new URL(location.href); u.searchParams.set('lang', lang); history.replaceState(null,'',u);
  render();
}));
render();
</script>
</body>
</html>
